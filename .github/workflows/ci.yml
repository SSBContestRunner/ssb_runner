name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  # The merge queue is not enabled today. Registering it now keeps the required
  # packaging checks from going permanently pending once it is (decision D1 in
  # docs/research/ci-run-43702798064-failure-analysis.md).
  merge_group:
  # Manual runs on the main branch: either a single platform or every platform.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

# Least privilege by default; the release job raises contents: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # test/dxcc_loader_test.dart reads assets/dxcc/*, and assets is a git submodule.
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Info-level lints are gating too, so analyzer debt cannot pile up again
        # (see docs/design/analyzer_infos_cleanup.md).
        run: flutter analyze --fatal-infos

      - name: Install Linux test dependencies
        # window_manager 0.6.0 reaches nativeapi/cnativeapi, whose build hook links
        # GTK3/X11/Xi via pkg-config during `flutter test`.
        #
        # The runner's mirror is intermittently unresolvable (ubuntu-26.04 sources go
        # through mirror+file:/etc/apt/apt-mirrors.txt -> azure.archive.ubuntu.com ->
        # security.ubuntu.com). apt waits ~20s per archive and libgtk-3-dev pulls 97 of
        # them, so run 43034797431 sat here for 68 minutes before exiting 100. Every
        # attempt is bounded, and the step asserts the headers with pkg-config instead of
        # trusting apt's exit code: awalsh128/cache-apt-pkgs-action@v1 reported success on
        # run 43060885441 after apt had fetched nothing ("Caching 0 installed packages"),
        # which skipped the old retry step and failed `flutter test` instead.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get "${apt_opts[@]}" update ||
              echo "::warning::apt-get update failed on attempt $attempt/3"
            timeout 180 sudo apt-get "${apt_opts[@]}" install -y libgtk-3-dev libx11-dev libxi-dev ||
              echo "::warning::apt-get install failed on attempt $attempt/3"
            if pkg-config --exists gtk+-3.0 x11 xi; then
              echo "GTK3/X11/Xi development files are present."
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::could not install Linux test dependencies after 3 attempts"
          exit 1

      - name: Test
        run: flutter test

  # Resolves which platforms the package jobs should build. Tag pushes always build
  # everything; a manual dispatch can also request a single platform. This job runs
  # unconditionally so needs.setup.outputs.matrix is always valid JSON, even when
  # the package jobs themselves are skipped (e.g. on pull requests).
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix from platform input
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          PLATFORM="${PLATFORM:-all}"
          # Linux is pinned to ubuntu-22.04 (glibc 2.35) instead of ubuntu-latest: the
          # bundle must run on Ubuntu 22.04 (glibc 2.35) and Debian 12 (2.36), and a
          # newer runner would silently raise that floor (see issue #23). 22.04 is
          # also the oldest usable runner -- the prebuilt libsqlite3.so that
          # package:sqlite3 downloads requires GLIBC_2.34.
          case "$PLATFORM" in
            all)     matrix='[{"os":"ubuntu-22.04","platform":"linux","targets":"deb,appimage,zip"},{"os":"windows-latest","platform":"windows","targets":"zip,exe"},{"os":"macos-latest","platform":"macos","targets":"dmg"}]' ;;
            linux)   matrix='[{"os":"ubuntu-22.04","platform":"linux","targets":"deb,appimage,zip"}]' ;;
            windows) matrix='[{"os":"windows-latest","platform":"windows","targets":"zip,exe"}]' ;;
            macos)   matrix='[{"os":"macos-latest","platform":"macos","targets":"dmg"}]' ;;
            *)
              echo "::error::Unknown platform '$PLATFORM' (expected: all, linux, windows, macos)"
              exit 1
              ;;
          esac
          # Windows ships both a portable zip and a single-file Inno Setup installer exe.
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  # L0 of the packaging verification layer (docs/research/
  # ci-run-43702798064-failure-analysis.md): static contracts over the three
  # platforms' packaging configuration, the CI orchestration and the pinned
  # packager. Seconds-level, so it runs on every event including tags, where it
  # also gates the package jobs -- a template error then fails in ~30s instead
  # of after a full rebuild.
  packaging-contract:
    name: Packaging contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install fastforge
        # The contract compares this activation's resolved flutter_app_packager
        # with the repo pin (decision D7: fail, do not skip, when the global lock
        # cannot be read).
        run: dart pub global activate fastforge 0.6.12

      - name: Validate packaging contract
        run: dart tool/packaging/validate_packaging.dart

      - name: Analyze the dry-run tool
        # tool/packaging/dry_run is its own package (the packager pins archive
        # ^3.6.1, the app needs ^4.0.7), so the root `flutter analyze` does not
        # cover it.
        working-directory: tool/packaging/dry_run
        run: |
          dart pub get
          dart analyze --fatal-infos

  # Native Windows code otherwise has no gate until a tag is pushed: package-windows only
  # runs on tags and manual dispatches, and `Analyze & Test` never touches windows/runner.
  # That is how run 43677974432 hit C3668 in audio_output_probe.h only at release time.
  # Compile the runner on every PR and branch push; the bundle, installer and smoke tests
  # stay restricted to tags and dispatches.
  compile-windows:
    name: Compile (windows)
    needs: analyze
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows runner
        # Same toolchain and build hooks as the packaged build (including the /W4 /WX
        # warnings-as-errors setting in windows/CMakeLists.txt); only packaging is skipped.
        run: flutter build windows --release

  # L1-L3 of the packaging verification layer: hand the real make_config.yaml and
  # templates to the same flutter_app_packager API fastforge calls, with a stub
  # bundle instead of `flutter build`. ISCC / dpkg-deb / appdmg / appimagetool
  # still run for real, which is what L0 cannot check (Liquid rendering, Pascal
  # syntax, control fields, dmg layout). Artifacts go to a temporary directory
  # and are discarded: nothing is uploaded or published (section 4.3).
  #
  # One job per platform so a failure names the platform and can be rerun alone.
  # Each needs the contract job: a broken template should not reach a tool run.
  validate-packaging-windows:
    name: Validate packaging (windows)
    needs: packaging-contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Ensure Inno Setup 6 (language files)
        shell: pwsh
        run: ./.github/scripts/ensure-inno-setup.ps1

      - name: Install dry-run dependencies
        working-directory: tool/packaging/dry_run
        run: dart pub get

      - name: Dry-run the exe maker (ISCC compile)
        working-directory: tool/packaging/dry_run
        run: dart run bin/dry_run_packaging.dart --platform=windows

      # On failure the rendered .iss and the packaging directory are left behind
      # (fastforge only deletes them after a successful compile), which is the
      # only copy of what ISCC actually parsed.
      - name: Upload packaging evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaging-dry-run-windows
          path: build/packaging-dry-run/**
          if-no-files-found: ignore

  validate-packaging-linux:
    name: Validate packaging (linux)
    needs: packaging-contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install appimagetool
        run: bash .github/scripts/install-appimagetool.sh

      - name: Install dry-run dependencies
        working-directory: tool/packaging/dry_run
        run: dart pub get

      - name: Dry-run the deb maker (dpkg-deb)
        working-directory: tool/packaging/dry_run
        run: dart run bin/dry_run_packaging.dart --platform=linux

      - name: Dry-run the AppImage maker (appimagetool)
        # The runner has no libfuse2; extracting the AppImage before running it
        # avoids installing it just to produce a throwaway image.
        working-directory: tool/packaging/dry_run
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: dart run bin/dry_run_packaging.dart --platform=linux --target=appimage

      - name: Upload packaging evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaging-dry-run-linux
          path: build/packaging-dry-run/**
          if-no-files-found: ignore

  validate-packaging-macos:
    name: Validate packaging (macos)
    needs: packaging-contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install dry-run dependencies
        working-directory: tool/packaging/dry_run
        run: dart pub get

      - name: Dry-run the dmg maker (appdmg + hdiutil)
        working-directory: tool/packaging/dry_run
        run: dart run bin/dry_run_packaging.dart --platform=macos

      - name: Upload packaging evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaging-dry-run-macos
          path: build/packaging-dry-run/**
          if-no-files-found: ignore

  # One job per platform rather than a single matrix job: a matrix job reports a single
  # aggregate conclusion, so one platform failing would skip every smoke test and the release
  # even when the other platforms built fine. Separate jobs keep a failure isolated, and each
  # smoke test then depends only on the artifact it actually exercises.
  #
  # `setup` still decides which platforms to build: tag pushes build all of them, a manual
  # dispatch builds the one requested, and a push/PR builds none.
  package-linux:
    name: Package (linux)
    needs: [analyze, setup, packaging-contract]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && contains(needs.setup.outputs.matrix, '"platform":"linux"'))
    runs-on: ubuntu-22.04
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        # Same bounded-retry rationale as the analyze job's test dependencies (see the
        # comment there); the step verifies the toolchain itself instead of trusting apt's
        # exit code. libfuse2 is required to execute appimagetool, which only ships as an
        # AppImage.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get "${apt_opts[@]}" update ||
              echo "::warning::apt-get update failed on attempt $attempt/3"
            timeout 180 sudo apt-get "${apt_opts[@]}" install -y \
              ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2 ||
              echo "::warning::apt-get install failed on attempt $attempt/3"
            if pkg-config --exists gtk+-3.0 x11 xi && command -v ninja > /dev/null; then
              echo "Linux build dependencies are present."
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::could not install Linux build dependencies after 3 attempts"
          exit 1

      - name: Install appimagetool
        # Pinned by sha256 in the script; shared with Validate packaging (linux) so
        # the two jobs cannot drift onto different builds.
        run: bash .github/scripts/install-appimagetool.sh

      - name: Link FVM path expected by distribute_options.yaml
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          test -n "$VERSION"
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_ROOT_DIR=$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)
          mkdir -p .fvm/versions
          rm -rf ".fvm/versions/$VERSION"
          ln -sfn "$FLUTTER_ROOT_DIR" ".fvm/versions/$VERSION"
          echo "linked .fvm/versions/$VERSION -> $FLUTTER_ROOT_DIR"

      - name: Install fastforge
        # 0.6.11+ is required: earlier releases pass FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER
        # through --dart-define, which Flutter 3.47 rejects (fastforge #354).
        run: dart pub global activate fastforge 0.6.12

      - name: Build & package
        run: >-
          dart pub global run fastforge:main package --platform=linux
          --targets=deb,appimage,zip
          --build-dart-define CRASH_ISSUE_TOKEN=${{ secrets.CRASH_ISSUE_TOKEN }}

      - name: Trim libjvm.so copied into the AppImage
        # The appimage maker copies the ldd dependencies of every bundled .so into
        # usr/lib, and the Android-only libdartjni.so resolves libjvm.so from this
        # runner's JDK -- ~24 MB that is never loaded on Linux. See
        # .github/scripts/trim-appimage-libjvm.sh.
        run: bash .github/scripts/trim-appimage-libjvm.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssb-runner-linux
          path: dist/**
          if-no-files-found: error

  package-windows:
    name: Package (windows)
    needs: [analyze, setup, packaging-contract]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && contains(needs.setup.outputs.matrix, '"platform":"windows"'))
    runs-on: windows-latest
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      # distribute_options.yaml pins FLUTTER_ROOT to a relative FVM path that only exists
      # locally. A directory junction is not enough on Windows: fastforge runs flutter through
      # cmd, which cannot execute the mixed-separator path the pin produces
      # (`.fvm/versions/3.47.5` + `\bin\flutter` -> "'.fvm' is not recognized"). Point the pin
      # at the installed SDK with native separators instead. Only the runner's checkout is
      # modified -- the committed file and local FVM builds are unaffected.
      - name: Point FLUTTER_ROOT at the installed SDK
        shell: pwsh
        run: |
          $flutterBin = (Get-Command flutter).Source
          $flutterRoot = Split-Path (Split-Path $flutterBin -Parent) -Parent
          if (-not (Test-Path $flutterRoot)) { throw "flutter root not found: $flutterRoot" }
          $config = Get-Content distribute_options.yaml -Raw
          $updated = $config -replace '(?m)^([ \t]*FLUTTER_ROOT[ \t]*:[ \t]*).*$', ('${1}' + $flutterRoot)
          if ($updated -eq $config) { throw 'FLUTTER_ROOT not found in distribute_options.yaml' }
          Set-Content -Path distribute_options.yaml -Value $updated -NoNewline
          Write-Host "FLUTTER_ROOT -> $flutterRoot"

      - name: Install fastforge
        # 0.6.11+ is required: earlier releases pass FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER
        # through --dart-define, which Flutter 3.47 rejects (fastforge #354).
        run: dart pub global activate fastforge 0.6.12

      - name: Ensure Inno Setup 6 (language files)
        # One script for the tag build and the PR dry run: the compiler layout and
        # the vendored unofficial translations must be identical in both.
        shell: pwsh
        run: ./.github/scripts/ensure-inno-setup.ps1

      - name: Build & package
        # Windows ships both a portable zip and a single-file Inno Setup installer exe.
        #
        # Fastforge shells out to `flutter build windows`, whose Dart build hooks
        # (flutter_soloud, sqlite3) download prebuilt native libraries from GitHub
        # releases. A transient failure there aborts the build with no diagnostics --
        # MSBuild swallows the hook output, leaving only "Building native assets
        # failed" -- and this step failed on run 36989183503 then passed on an
        # immediate rerun of the identical commit and runner image. Retry the whole
        # step so one flake does not fail the release; the hook download cache under
        # .dart_tool survives between attempts, so a retry does not re-download.
        #
        # A compiler diagnostic (error C####) is deterministic, and retrying it just
        # burned ~12 minutes per run (run 43677974432, C3668), so that case fails on
        # the first attempt instead.
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "== fastforge package attempt $attempt/$attempts =="
            $log = Join-Path $env:RUNNER_TEMP "fastforge-package-$attempt.log"
            $ok = $false
            try {
              dart pub global run fastforge:main package --platform=windows --targets=zip,exe --build-dart-define "CRASH_ISSUE_TOKEN=${{ secrets.CRASH_ISSUE_TOKEN }}" 2>&1 |
                Tee-Object -FilePath $log
              $ok = ($LASTEXITCODE -eq 0)
            } catch {
              Write-Host "attempt $attempt threw: $_"
            }
            if ($ok) { exit 0 }
            # Only a deterministic diagnostic short-circuits. The generic "Build process
            # failed." line also ends the transient native-assets failures above, so
            # matching it would switch off the retry this loop exists for.
            #
            # The ISCC diagnostics are here for the same reason as the MSVC one: retrying
            # a template error rebuilt the whole bundle twice more (~9m30s in run
            # 43702798064) to print the identical "Invalid section tag" at the same line.
            $diagnostics = @()
            if (Test-Path -LiteralPath $log) {
              $diagnostics = @(Select-String -LiteralPath $log -Pattern 'error C\d{4}:', 'Invalid section tag', 'Compile aborted')
            }
            if ($diagnostics.Count -gt 0) {
              Write-Host "::error::fastforge package failed with a compile error; not retrying ($log)"
              $diagnostics | Select-Object -First 20 | ForEach-Object { Write-Host $_.Line }
              exit 1
            }
            Write-Host "::warning::fastforge package failed on attempt $attempt/$attempts"
          }
          Write-Host "::error::fastforge package failed after $attempts attempts"
          exit 1

      - name: Check bundled binaries stay within the Windows 10 1607 floor
        # A clean `flutter build windows` can still ship a dependency that raises
        # the real OS floor through a static import (window_manager -> cnativeapi
        # imports user32!GetDpiForWindow, which only exists from 1607/build
        # 14393). The Release directory is what gets packaged, so auditing its
        # import tables catches the regression here instead of in a crash report
        # from an older system -- see
        # docs/research/windows-10-rtm-cnativeapi-load-failure.md.
        run: dart run tool/check_windows_imports.dart build/windows/x64/runner/Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssb-runner-windows
          path: dist/**
          if-no-files-found: error

      # fastforge deletes the rendered .iss after a successful compile but leaves it
      # (and the packaging directory) behind on failure -- that copy plus the
      # fastforge log is what a template failure has to be diagnosed from.
      - name: Upload packaging failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaging-evidence
          path: |
            dist/**/*.iss
            dist/**/*_exe/**
            ${{ runner.temp }}/fastforge-package-*.log
          if-no-files-found: ignore

  package-macos:
    name: Package (macos)
    needs: [analyze, setup, packaging-contract]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && contains(needs.setup.outputs.matrix, '"platform":"macos"'))
    runs-on: macos-latest
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install macOS packaging tools
        # fastforge's dmg maker shells out to appdmg; pre-install it so fastforge
        # does not need to fall back to `pnpm install -g appdmg` (which may not be on PATH).
        run: npm install -g appdmg

      # distribute_options.yaml pins FLUTTER_ROOT to the FVM path (.fvm/versions/<version>),
      # which only exists locally. Recreate that path on the runner so the config stays
      # untouched and local builds keep working.
      - name: Link FVM path expected by distribute_options.yaml
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          test -n "$VERSION"
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_ROOT_DIR=$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)
          mkdir -p .fvm/versions
          rm -rf ".fvm/versions/$VERSION"
          ln -sfn "$FLUTTER_ROOT_DIR" ".fvm/versions/$VERSION"
          echo "linked .fvm/versions/$VERSION -> $FLUTTER_ROOT_DIR"

      - name: Install fastforge
        # 0.6.11+ is required: earlier releases pass FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER
        # through --dart-define, which Flutter 3.47 rejects (fastforge #354).
        run: dart pub global activate fastforge 0.6.12

      - name: Build & package
        run: >-
          dart pub global run fastforge:main package --platform=macos
          --targets=dmg
          --build-dart-define CRASH_ISSUE_TOKEN=${{ secrets.CRASH_ISSUE_TOKEN }}

      # Replaces the old Intel-runner smoke test (that VM froze intermittently and was
      # cancelled before it could report anything). The bundle is universal only because
      # Xcode's Release configuration leaves ARCHS_STANDARD (arm64 + x86_64) in place;
      # nothing in the repo pins it, so an ONLY_ACTIVE_ARCH/EXCLUDED_ARCHS change would
      # silently drop the x86_64 slice while still building fine on Apple Silicon. `lipo`
      # reads both slices without needing Intel hardware, so assert both here instead.
      - name: Verify universal slices (arm64 + x86_64)
        shell: bash
        run: |
          set -euo pipefail
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          [[ -n "$app" ]] || { echo "::error::no .app under build/macos/Build/Products/Release"; exit 1; }
          echo "checking $app"
          status=0
          check_universal() {
            local bin="$1" info
            info=$(lipo -info "$bin" 2>&1) || true
            if grep -q 'x86_64' <<<"$info" && grep -q 'arm64' <<<"$info"; then
              echo "  ok   $(basename "$bin"): $info"
            else
              echo "::error::$(basename "$bin") is not universal: $info"
              status=1
            fi
          }
          exe="$app/Contents/MacOS/$(basename "$app" .app)"
          [[ -x "$exe" ]] || { echo "::error::no executable at $exe"; exit 1; }
          check_universal "$exe"
          # Covers the engine (FlutterMacOS), the plugins, and App.framework -- the Dart AOT
          # snapshot is compiled per architecture by two gen_snapshot runs and lipo'd
          # together, so it is the piece most likely to drift.
          for fw in "$app/Contents/Frameworks"/*.framework; do
            [[ -d "$fw" ]] || continue
            name=$(basename "$fw" .framework)
            # Versioned bundles keep the binary under Versions/A; flat bundles do not.
            bin="$fw/Versions/A/$name"
            [[ -f "$bin" ]] || bin="$fw/$name"
            if [[ -f "$bin" ]]; then
              check_universal "$bin"
            else
              echo "::error::no binary inside $(basename "$fw")"
              status=1
            fi
          done
          [[ $status -eq 0 ]] || exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssb-runner-macos
          path: dist/**
          if-no-files-found: error

  # Installs the built .deb on a clean Debian 12, fails if it cannot install or its libraries
  # cannot load (issue #23), then starts the app under Xvfb and closes its window to assert
  # the process exits. Debian 12 is the oldest target we can boot in a container; the floor
  # we actually promise is older (Ubuntu 22.04 / glibc 2.35, GLIBCXX_3.4.30), so the script
  # checks symbols against those fixed versions instead of the container's. It also extracts
  # the .AppImage and applies the same check to the bundle plus the libstdc++/libgcc_s copies
  # in its usr/lib, then launches it the same way.
  #
  # Depending only on package-linux means it runs exactly when the Linux artifact exists, and
  # an unrelated platform failing no longer skips it. No `if` is needed: a skipped or failed
  # dependency skips this job too, which is the desired behaviour in both cases.
  smoke-test-debian:
    name: Smoke test (Debian 12)
    needs: package-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-linux
          path: artifacts

      - name: Run Debian 12 smoke test
        run: bash .github/scripts/smoke-test-debian.sh

  # Closes the window with a real WM_CLOSE and asserts the process is gone afterwards. This
  # is the regression guard for "the window disappeared but the process stayed in Task
  # Manager" -- see docs/design/desktop_exit_design.md. Depends only on package-windows, so
  # it runs exactly when the Windows artifact exists.
  smoke-test-windows:
    name: Smoke test (Windows)
    needs: package-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-windows
          path: artifacts

      - name: Run Windows smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows.ps1

      # A startup crash leaves no application log (the file sink is installed after
      # the first frame), so the scripts copy the WER event, the minidump, the native
      # startup timeline and the synchronous Dart exit trace into smoke-evidence/ for
      # the failure report; a hang also gets its own dump before it is killed.
      - name: Upload Windows smoke evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-evidence
          path: smoke-evidence/**
          if-no-files-found: ignore

  # Round-trips the single-file installer on a clean Windows runner: silent per-user install,
  # assert the bundle (including the app-local MSVC runtime DLLs) landed complete, start the
  # app, then silently uninstall and assert the install directory and shortcut are gone.
  smoke-test-windows-installer:
    name: Smoke test (Windows installer)
    needs: package-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-windows
          path: artifacts

      - name: Run Windows installer smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows-installer.ps1

      - name: Upload Windows installer smoke evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-smoke-evidence
          path: smoke-evidence/**
          if-no-files-found: ignore

  # Same regression guard as the Windows job, for the macOS runner's own teardown path: the
  # app closes its window at SSB_RUNNER_TEST_CLOSE_WINDOW_AFTER seconds (window_manager ->
  # [NSWindow performClose], i.e. the red button) and the process must be gone afterwards.
  # The close has to come from inside the app because a CI session cannot grant the
  # Accessibility/automation permissions AppleScript would need.
  smoke-test-macos:
    name: Smoke test (macOS)
    needs: package-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-macos
          path: artifacts

      - name: Run macOS smoke test
        run: bash .github/scripts/smoke-test-macos.sh

  # A release only ships a complete set, so every package and all four smoke tests must
  # have succeeded. Tag pushes are the only way in, and those build all three platforms.
  release:
    name: Draft GitHub Release
    needs:
      - package-linux
      - package-windows
      - package-macos
      - smoke-test-debian
      - smoke-test-windows
      - smoke-test-windows-installer
      - smoke-test-macos
    # Only tag pushes create a draft release: on workflow_dispatch the ref is
    # refs/heads/<branch>, so action-gh-release cannot derive tag_name and fails with
    # 400 "Missing tag_name parameter".
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checks out .github/scripts/generate-checksums.sh; no submodules or build inputs
      # are needed here, everything else comes from the downloaded artifacts.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # fastforge writes into dist/<version>/, and action-gh-release needs plain file
      # globs (it calls statSync on each match), so flatten everything first.
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release

      # The checksums in the release notes and the SHA256SUMS.txt asset both come from
      # this step, so they cannot drift. It also asserts the manifest covers every file
      # and re-verifies each hash, failing the job instead of publishing a partial list.
      #
      # If assets are replaced or added by hand while the draft is being edited, rerun
      # this step: the previously published notes would still describe the old files.
      - name: Generate SHA-256 checksums
        run: bash .github/scripts/generate-checksums.sh release notes/checksums.md

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          # body_path is prepended to the generated notes (not a replacement), so the
          # fingerprints sit above the auto-generated changelog. notes/ stays outside
          # release/ so the markdown is not uploaded as an asset.
          body_path: notes/checksums.md
          draft: true
          generate_release_notes: true
