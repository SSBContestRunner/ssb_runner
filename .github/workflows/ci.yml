name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  # Manual runs on the main branch: either a single platform or every platform.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

# Least privilege by default; the release job raises contents: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # test/dxcc_loader_test.dart reads assets/dxcc/*, and assets is a git submodule.
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Only warnings/errors fail the gate; info-level lints are reported but non-blocking.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # Resolves which platforms the package jobs should build. Tag pushes always build
  # everything; a manual dispatch can also request a single platform. This job runs
  # unconditionally so needs.setup.outputs.matrix is always valid JSON, even when
  # the package jobs themselves are skipped (e.g. on pull requests).
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix from platform input
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          PLATFORM="${PLATFORM:-all}"
          # Linux is pinned to ubuntu-22.04 (glibc 2.35) instead of ubuntu-latest: the
          # bundle must run on Ubuntu 22.04 (glibc 2.35) and Debian 12 (2.36), and a
          # newer runner would silently raise that floor (see issue #23). 22.04 is
          # also the oldest usable runner -- the prebuilt libsqlite3.so that
          # package:sqlite3 downloads requires GLIBC_2.34.
          case "$PLATFORM" in
            all)     matrix='[{"os":"ubuntu-22.04","platform":"linux","targets":"deb,appimage,zip"},{"os":"windows-latest","platform":"windows","targets":"zip,exe"},{"os":"macos-latest","platform":"macos","targets":"dmg"}]' ;;
            linux)   matrix='[{"os":"ubuntu-22.04","platform":"linux","targets":"deb,appimage,zip"}]' ;;
            windows) matrix='[{"os":"windows-latest","platform":"windows","targets":"zip,exe"}]' ;;
            macos)   matrix='[{"os":"macos-latest","platform":"macos","targets":"dmg"}]' ;;
            *)
              echo "::error::Unknown platform '$PLATFORM' (expected: all, linux, windows, macos)"
              exit 1
              ;;
          esac
          # Windows ships both a portable zip and a single-file Inno Setup installer exe.
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  # One job per platform rather than a single matrix job: a matrix job reports a single
  # aggregate conclusion, so one platform failing would skip every smoke test and the release
  # even when the other platforms built fine. Separate jobs keep a failure isolated, and each
  # smoke test then depends only on the artifact it actually exercises.
  #
  # `setup` still decides which platforms to build: tag pushes build all of them, a manual
  # dispatch builds the one requested, and a push/PR builds none.
  package-linux:
    name: Package (linux)
    needs: [analyze, setup]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && contains(needs.setup.outputs.matrix, '"platform":"linux"'))
    runs-on: ubuntu-22.04
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # libfuse2 is required to execute appimagetool, which only ships as an AppImage.
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Link FVM path expected by distribute_options.yaml
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          test -n "$VERSION"
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_ROOT_DIR=$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)
          mkdir -p .fvm/versions
          rm -rf ".fvm/versions/$VERSION"
          ln -sfn "$FLUTTER_ROOT_DIR" ".fvm/versions/$VERSION"
          echo "linked .fvm/versions/$VERSION -> $FLUTTER_ROOT_DIR"

      - name: Install fastforge
        # 0.6.11+ is required: earlier releases pass FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER
        # through --dart-define, which Flutter 3.47 rejects (fastforge #354).
        run: dart pub global activate fastforge 0.6.12

      - name: Build & package
        run: >-
          dart pub global run fastforge:main package --platform=linux
          --targets=deb,appimage,zip
          --build-dart-define CRASH_ISSUE_TOKEN=${{ secrets.CRASH_ISSUE_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssb-runner-linux
          path: dist/**
          if-no-files-found: error

  package-windows:
    name: Package (windows)
    needs: [analyze, setup]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && contains(needs.setup.outputs.matrix, '"platform":"windows"'))
    runs-on: windows-latest
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      # distribute_options.yaml pins FLUTTER_ROOT to a relative FVM path that only exists
      # locally. A directory junction is not enough on Windows: fastforge runs flutter through
      # cmd, which cannot execute the mixed-separator path the pin produces
      # (`.fvm/versions/3.47.5` + `\bin\flutter` -> "'.fvm' is not recognized"). Point the pin
      # at the installed SDK with native separators instead. Only the runner's checkout is
      # modified -- the committed file and local FVM builds are unaffected.
      - name: Point FLUTTER_ROOT at the installed SDK
        shell: pwsh
        run: |
          $flutterBin = (Get-Command flutter).Source
          $flutterRoot = Split-Path (Split-Path $flutterBin -Parent) -Parent
          if (-not (Test-Path $flutterRoot)) { throw "flutter root not found: $flutterRoot" }
          $config = Get-Content distribute_options.yaml -Raw
          $updated = $config -replace '(?m)^([ \t]*FLUTTER_ROOT[ \t]*:[ \t]*).*$', ('${1}' + $flutterRoot)
          if ($updated -eq $config) { throw 'FLUTTER_ROOT not found in distribute_options.yaml' }
          Set-Content -Path distribute_options.yaml -Value $updated -NoNewline
          Write-Host "FLUTTER_ROOT -> $flutterRoot"

      - name: Install fastforge
        # 0.6.11+ is required: earlier releases pass FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER
        # through --dart-define, which Flutter 3.47 rejects (fastforge #354).
        run: dart pub global activate fastforge 0.6.12

      - name: Ensure Inno Setup 6
        # fastforge's exe target resolves ISCC.exe from the default Inno Setup 6 path;
        # images normally preinstall it, but install it explicitly if missing.
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host 'Inno Setup 6 not found; installing via winget'
            winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          Write-Host "ISCC -> $iscc"

      - name: Build & package
        # Windows ships both a portable zip and a single-file Inno Setup installer exe.
        #
        # Fastforge shells out to `flutter build windows`, whose Dart build hooks
        # (flutter_soloud, sqlite3) download prebuilt native libraries from GitHub
        # releases. A transient failure there aborts the build with no diagnostics --
        # MSBuild swallows the hook output, leaving only "Building native assets
        # failed" -- and this step failed on run 36989183503 then passed on an
        # immediate rerun of the identical commit and runner image. Retry the whole
        # step so one flake does not fail the release; the hook download cache under
        # .dart_tool survives between attempts, so a retry does not re-download.
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            Write-Host "== fastforge package attempt $attempt/$attempts =="
            $ok = $false
            try {
              dart pub global run fastforge:main package --platform=windows --targets=zip,exe --build-dart-define "CRASH_ISSUE_TOKEN=${{ secrets.CRASH_ISSUE_TOKEN }}"
              $ok = ($LASTEXITCODE -eq 0)
            } catch {
              Write-Host "attempt $attempt threw: $_"
            }
            if ($ok) { exit 0 }
            Write-Host "::warning::fastforge package failed on attempt $attempt/$attempts"
          }
          Write-Host "::error::fastforge package failed after $attempts attempts"
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssb-runner-windows
          path: dist/**
          if-no-files-found: error

  package-macos:
    name: Package (macos)
    needs: [analyze, setup]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && contains(needs.setup.outputs.matrix, '"platform":"macos"'))
    runs-on: macos-latest
    steps:
      # .gitmodules pins the public assets submodule to an SSH URL so local pushes use the
      # developer's SSH key. Runners have no key, so rewrite it back to HTTPS for the clone.
      - name: Clone submodules over HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install macOS packaging tools
        # fastforge's dmg maker shells out to appdmg; pre-install it so fastforge
        # does not need to fall back to `pnpm install -g appdmg` (which may not be on PATH).
        run: npm install -g appdmg

      # distribute_options.yaml pins FLUTTER_ROOT to the FVM path (.fvm/versions/<version>),
      # which only exists locally. Recreate that path on the runner so the config stays
      # untouched and local builds keep working.
      - name: Link FVM path expected by distribute_options.yaml
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          test -n "$VERSION"
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_ROOT_DIR=$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)
          mkdir -p .fvm/versions
          rm -rf ".fvm/versions/$VERSION"
          ln -sfn "$FLUTTER_ROOT_DIR" ".fvm/versions/$VERSION"
          echo "linked .fvm/versions/$VERSION -> $FLUTTER_ROOT_DIR"

      - name: Install fastforge
        # 0.6.11+ is required: earlier releases pass FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER
        # through --dart-define, which Flutter 3.47 rejects (fastforge #354).
        run: dart pub global activate fastforge 0.6.12

      - name: Build & package
        run: >-
          dart pub global run fastforge:main package --platform=macos
          --targets=dmg
          --build-dart-define CRASH_ISSUE_TOKEN=${{ secrets.CRASH_ISSUE_TOKEN }}

      # Replaces the old Intel-runner smoke test (that VM froze intermittently and was
      # cancelled before it could report anything). The bundle is universal only because
      # Xcode's Release configuration leaves ARCHS_STANDARD (arm64 + x86_64) in place;
      # nothing in the repo pins it, so an ONLY_ACTIVE_ARCH/EXCLUDED_ARCHS change would
      # silently drop the x86_64 slice while still building fine on Apple Silicon. `lipo`
      # reads both slices without needing Intel hardware, so assert both here instead.
      - name: Verify universal slices (arm64 + x86_64)
        shell: bash
        run: |
          set -euo pipefail
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          [[ -n "$app" ]] || { echo "::error::no .app under build/macos/Build/Products/Release"; exit 1; }
          echo "checking $app"
          status=0
          check_universal() {
            local bin="$1" info
            info=$(lipo -info "$bin" 2>&1) || true
            if grep -q 'x86_64' <<<"$info" && grep -q 'arm64' <<<"$info"; then
              echo "  ok   $(basename "$bin"): $info"
            else
              echo "::error::$(basename "$bin") is not universal: $info"
              status=1
            fi
          }
          exe="$app/Contents/MacOS/$(basename "$app" .app)"
          [[ -x "$exe" ]] || { echo "::error::no executable at $exe"; exit 1; }
          check_universal "$exe"
          # Covers the engine (FlutterMacOS), the plugins, and App.framework -- the Dart AOT
          # snapshot is compiled per architecture by two gen_snapshot runs and lipo'd
          # together, so it is the piece most likely to drift.
          for fw in "$app/Contents/Frameworks"/*.framework; do
            [[ -d "$fw" ]] || continue
            name=$(basename "$fw" .framework)
            # Versioned bundles keep the binary under Versions/A; flat bundles do not.
            bin="$fw/Versions/A/$name"
            [[ -f "$bin" ]] || bin="$fw/$name"
            if [[ -f "$bin" ]]; then
              check_universal "$bin"
            else
              echo "::error::no binary inside $(basename "$fw")"
              status=1
            fi
          done
          [[ $status -eq 0 ]] || exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssb-runner-macos
          path: dist/**
          if-no-files-found: error

  # Installs the built .deb on a clean Debian 12 (our oldest supported target), fails if it
  # cannot install or its libraries cannot load (issue #23), then starts the app under Xvfb
  # and closes its window to assert the process exits.
  #
  # Depending only on package-linux means it runs exactly when the Linux artifact exists, and
  # an unrelated platform failing no longer skips it. No `if` is needed: a skipped or failed
  # dependency skips this job too, which is the desired behaviour in both cases.
  smoke-test-debian:
    name: Smoke test (Debian 12)
    needs: package-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-linux
          path: artifacts

      - name: Run Debian 12 smoke test
        run: bash .github/scripts/smoke-test-debian.sh

  # Closes the window with a real WM_CLOSE and asserts the process is gone afterwards. This
  # is the regression guard for "the window disappeared but the process stayed in Task
  # Manager" -- see docs/design/desktop_exit_design.md. Depends only on package-windows, so
  # it runs exactly when the Windows artifact exists.
  smoke-test-windows:
    name: Smoke test (Windows)
    needs: package-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-windows
          path: artifacts

      - name: Run Windows smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows.ps1

  # Round-trips the single-file installer on a clean Windows runner: silent per-user install,
  # assert the bundle (including the app-local MSVC runtime DLLs) landed complete, start the
  # app, then silently uninstall and assert the install directory and shortcut are gone.
  smoke-test-windows-installer:
    name: Smoke test (Windows installer)
    needs: package-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-windows
          path: artifacts

      - name: Run Windows installer smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows-installer.ps1

  # Same regression guard as the Windows job, for the macOS runner's own teardown path: the
  # app closes its window at SSB_RUNNER_TEST_CLOSE_WINDOW_AFTER seconds (window_manager ->
  # [NSWindow performClose], i.e. the red button) and the process must be gone afterwards.
  # The close has to come from inside the app because a CI session cannot grant the
  # Accessibility/automation permissions AppleScript would need.
  smoke-test-macos:
    name: Smoke test (macOS)
    needs: package-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ssb-runner-macos
          path: artifacts

      - name: Run macOS smoke test
        run: bash .github/scripts/smoke-test-macos.sh

  # A release only ships a complete set, so every package and all four smoke tests must
  # have succeeded. Tag pushes are the only way in, and those build all three platforms.
  release:
    name: Draft GitHub Release
    needs:
      - package-linux
      - package-windows
      - package-macos
      - smoke-test-debian
      - smoke-test-windows
      - smoke-test-windows-installer
      - smoke-test-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # fastforge writes into dist/<version>/, and action-gh-release needs plain file
      # globs (it calls statSync on each match), so flatten everything first.
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          draft: true
          generate_release_notes: true
