name: ssb_runner
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.3.0+300009 # VersionCode using scheme: MM_NN_PP_BBB

environment:
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  flutter_soloud: ^5.3.2
  flutter_bloc: ^9.1.1
  statemachine: ^3.4.0
  collection: ^1.19.1
  equatable: ^3.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.2
  path_provider: ^2.1.6
  archive: ^4.7.1
  xml: ^7.1.0
  window_manager: ^0.7.1
  # Direct for DisplayManager.workArea (the primary screen's usable area), which
  # window_manager 0.7 uses but does not re-export. Version is locked by
  # window_manager's own constraint.
  nativeapi: ^0.6.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  worker_manager: ^7.2.9
  logger: ^2.8.0
  package_info_plus: ^10.2.2
  toastification: ^3.2.2
  catcher_2: ^2.1.12
  intl: ^0.20.3
  file_selector: ^1.1.0
  web: ^1.1.2

  # Material widgets now live outside the Flutter SDK (Flutter 3.50 deprecates
  # package:flutter/material.dart); dart fix --code=migrate_design_widgets
  # rewrote the imports to this package.
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

  # Used by tool/packaging/ (the static packaging contract and its fixtures).
  path: ^1.9.1
  yaml: ^3.1.4

# Native library provisioning for package:sqlite3.
# sqlite3_flutter_libs is end-of-life: package:sqlite3 3.x now bundles SQLite
# through Dart build hooks. "sqlite3" is the default source and ships prebuilt
# binaries (FTS5 / RTREE / math functions). Alternatives: sqlite3mc or
# sqlcipher for encryption, system/source for custom builds.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3

# Web WASM assets (web/sqlite3.wasm, web/drift_worker.js) must stay paired with
# the resolved `drift` version:
#   - drift_worker.js is copied from the drift package root;
#   - sqlite3.wasm is copied from drift's extension/devtools/build/.
# The sqlite3 3.9.0 release wasm imports `dart.dispatch_trace`, which drift
# 2.35.3's worker does not provide and which fails at startup with a
# WebAssembly LinkError. Re-copy both files whenever drift is upgraded.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates AppLocalizations from the ARB files in lib/l10n (see l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/callsign/
    - assets/logo/
    - assets/voice/Global/ICAO/
    - assets/voice/Global/Number/
    - assets/voice/Global/Common/
    - assets/voice/US/Common/
    - assets/voice/US/Alphabet/
    - assets/voice/US/ICAO/
    - assets/voice/US/Location/
    - assets/voice/US/Number/
    - assets/voice/UK/Common/
    - assets/voice/UK/Alphabet/
    - assets/voice/UK/ICAO/
    - assets/voice/UK/Location/
    - assets/voice/UK/Number/
    - assets/voice/JP/Common/
    - assets/voice/JP/Alphabet/
    - assets/voice/JP/ICAO/
    - assets/voice/JP/Location/
    - assets/voice/JP/Number/
    - assets/voice/RU/Common/
    - assets/voice/RU/Alphabet/
    - assets/voice/RU/ICAO/
    - assets/voice/RU/Location/
    - assets/voice/RU/Number/
    - assets/voice/IN/Common/
    - assets/voice/IN/Alphabet/
    - assets/voice/IN/ICAO/
    - assets/voice/IN/Location/
    - assets/voice/IN/Number/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package


  fonts:
    # Latin/digit face for data and UI text. Subsetted from Iosevka v34.9.1
    # (SIL OFL, see fonts/LICENSE-Iosevka.txt) to printable ASCII plus the
    # symbols the UI renders (· × – — … ✕). Rebuild with tool/build_fonts.py.
    - family: Iosevka
      fonts:
        - asset: fonts/Iosevka-Regular-sub.ttf
    # CJK face for everything Iosevka lacks, subsetted to the characters used
    # by the app's UI strings. Source: Noto Sans SC 2.004 (SIL OFL, see
    # fonts/LICENSE-NotoSansSC.txt). Rebuild with tool/build_fonts.py; do not
    # hand-edit, because a glyph missing here falls back to a system font per
    # character (Microsoft YaHei on Windows) and breaks the typography.
    - family: Noto Sans SC
      fonts:
        - asset: fonts/NotoSansSC-Regular-sub.otf
        - asset: fonts/NotoSansSC-Medium-sub.otf
          weight: 500
        - asset: fonts/NotoSansSC-Bold-sub.otf
          weight: 700

# Force every remaining package to the newest published version where the
# constraint is loose enough to allow it:
#   cli_util -> drift_dev (drift_dev still pins an older cli_util).
# The Flutter SDK pins material_color_utilities / test_api exactly one patch
# behind pub; the app deliberately uses the newest patch (verified by the full
# test suite), so both stay overridden.
# Do NOT override a transitive major that a direct dependency pins with an
# upper bound (e.g. file_selector -> cross_file ^0.3.0, which blocks
# catcher_2 3.x): that only creates a fork.
dependency_overrides:
  cli_util: ^0.6.1
  material_color_utilities: ^0.13.1
  test_api: ^0.7.15
