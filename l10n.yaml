arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n/generated
nullable-getter: false
preferred-supported-locales:
  - en
  - zh
  - zh_Hans
  - zh_Hant
  - ja
untranslated-messages-file: build/l10n_untranslated.json
# Flutter 3.50 still generates references to flutter_localizations'
# deprecated GlobalMaterialLocalizations/GlobalCupertinoLocalizations
# (material_ui/cupertino_ui are the replacements). Silence only that
# deprecation, and only in the generated files.
header: "// ignore_for_file: deprecated_member_use"
